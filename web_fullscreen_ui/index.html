<style>
:root{--c:0,240,255;--cy:#00f0ff;--vi:#a78bfa;--gr:#5af0c0;--tx:#d8fbff}
html,body{height:100%;margin:0;overflow:hidden;background:#04090f;color:var(--tx);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
body{background:radial-gradient(ellipse at 50% 40%,#0a1f2c 0%,#050f17 55%,#02070c 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;filter:blur(2.5px) brightness(1.1) saturate(1.1);transform:scale(1.04);will-change:transform}
#fx{position:fixed;inset:0;z-index:0}
#stage{position:fixed;inset:0;z-index:2;perspective:1600px;transform-style:preserve-3d;pointer-events:none}
#rig{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#rig>*{pointer-events:auto}
.mono{font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
/* 光学面板：无实体填充，仅微光渐变 + 描边 + 四角角标 */
.holo{position:absolute;background:linear-gradient(160deg,rgba(var(--c),.06),rgba(var(--c),.015) 60%,rgba(var(--c),.04));border:1px solid rgba(var(--c),.2);box-shadow:0 0 16px rgba(var(--c),.07),inset 0 0 24px rgba(var(--c),.05);padding:16px 18px}
.holo::before{content:"";position:absolute;inset:-2px;pointer-events:none;--k:linear-gradient(var(--cy),var(--cy));
background:var(--k) 0 0/16px 2px no-repeat,var(--k) 0 0/2px 16px no-repeat,var(--k) 100% 0/16px 2px no-repeat,var(--k) 100% 0/2px 16px no-repeat,var(--k) 0 100%/16px 2px no-repeat,var(--k) 0 100%/2px 16px no-repeat,var(--k) 100% 100%/16px 2px no-repeat,var(--k) 100% 100%/2px 16px no-repeat;filter:drop-shadow(0 0 2px var(--cy))}
.ttl{font-size:15px;letter-spacing:.08em;color:#eaffff;text-shadow:0 0 8px rgba(var(--c),.45);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.ttl small{font-size:11px;color:rgba(var(--c),.7)}
.fld{width:100%;background:rgba(var(--c),.05);border:1px solid rgba(var(--c),.3);color:var(--tx);padding:7px 9px;font-size:13px;outline:none;min-width:0}
.fld:focus{border-color:var(--cy);box-shadow:0 0 10px rgba(var(--c),.4)}
.fld option{background:#06121b}
.btn{background:rgba(var(--c),.14);border:1px solid rgba(var(--c),.55);color:#eaffff;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:rgba(var(--c),.3);box-shadow:0 0 14px rgba(var(--c),.6)}
.btn:focus-visible,.fld:focus-visible,.slot:focus-visible,.tog:focus-visible{outline:2px solid #fff;outline-offset:2px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--gr)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)}
.badge.off{color:#ff7a8a}.badge.off i{background:#ff5a70;box-shadow:0 0 8px #ff5a70}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mod,.slot{aspect-ratio:1/.92;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;background:rgba(var(--c),.05);border:1px solid rgba(var(--c),.35);color:var(--tx);transition:.15s;position:relative}
.mod:hover{background:rgba(var(--c),.18);box-shadow:0 0 14px rgba(var(--c),.45)}
.mod b{font-size:20px;font-weight:400;color:var(--cy);text-shadow:0 0 8px var(--cy)}
.slot{border:1px dashed rgba(var(--c),.4);color:rgba(var(--c),.65);background:transparent}
.slot::before,.slot::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--cy);opacity:.8}
.slot::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.slot::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.slot:hover{background:rgba(var(--c),.1);color:#fff}
.slot b{font-size:24px;font-weight:300}
.tel{display:flex;align-items:center;gap:14px;margin:12px 0}
.tel svg{width:56px;height:56px;transform:rotate(-90deg);flex:none}
.tel circle{fill:none;stroke-width:4}
.tel .bg{stroke:rgba(255,255,255,.1)}
.tel .fg{stroke-linecap:round;transition:stroke-dashoffset .8s;filter:drop-shadow(0 0 5px currentColor)}
.tel .v{position:absolute;top:0;left:0;width:56px;text-align:center;font-size:12px;line-height:56px}
.tel .n{font-size:17px;letter-spacing:.1em}.tel .s{font-size:11px;color:rgba(var(--c),.65)}
#log{font-size:11px;line-height:1.65;color:rgba(190,245,255,.85);height:112px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log div:last-child{color:#fff;text-shadow:0 0 6px var(--cy)}
/* 中央 */
#sub{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(760px,56vw);text-align:center;font-size:clamp(20px,2.5vw,36px);font-weight:500;color:#f2ffff;letter-spacing:.04em;line-height:1.4;text-shadow:0 0 10px rgba(var(--c),.55),0 0 26px rgba(var(--c),.3),0 2px 4px #000;pointer-events:none;transition:opacity .3s}
#togs{position:absolute;left:50%;bottom:14.5%;transform:translateX(-50%);display:flex;gap:14px}
.tog{background:rgba(var(--c),.06);border:1px solid rgba(var(--c),.5);color:var(--tx);padding:8px 16px;font-size:13px;cursor:pointer;position:relative;box-shadow:0 0 14px rgba(var(--c),.2);transition:.15s;white-space:nowrap}
.tog:hover{background:rgba(var(--c),.2)}
.tog em{font-style:normal;margin-left:6px;color:#ff7a8a}
.tog.on em{color:var(--gr);text-shadow:0 0 8px var(--gr)}
.tog.on{border-color:var(--cy);box-shadow:0 0 18px rgba(var(--c),.5)}
#cmd{left:50%;bottom:3.5%;width:min(640px,46vw);transform:translateX(-50%) rotateX(16deg);transform-origin:50% 100%;display:flex;gap:10px;padding:10px 12px}
#top{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:26px 44px;pointer-events:none}
.logo{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--cy);display:grid;place-items:center;box-shadow:0 0 20px rgba(var(--c),.5),inset 0 0 14px rgba(var(--c),.3);margin-right:18px}
#pL{width:25%}#pL.collapsed{width:184px}#pR{width:22%}#pR.collapsed{width:176px}
.holo.side{transition:width .35s cubic-bezier(.2,.8,.2,1),padding .35s}
.side .mini{display:none}.side.collapsed{padding:10px 14px}.side.collapsed .full{display:none}.side.collapsed .mini{display:flex}
.mini{align-items:center;justify-content:space-between;gap:10px;font-size:13px;cursor:pointer;white-space:nowrap}
.cbtn{display:grid;place-items:center;background:none;border:1px solid rgba(var(--c),.45);color:var(--cy);width:22px;height:22px;line-height:1;cursor:pointer;font-size:15px;flex:none;padding:0}
.cbtn:hover,.mini:hover .cbtn{background:rgba(var(--c),.25);box-shadow:0 0 10px rgba(var(--c),.5)}
.ttl,.ttl *{white-space:nowrap}.ttl span:last-child{display:flex;align-items:center;gap:10px}
body::after{content:'';position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.45) 100%)}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 72%)}
.hud{position:fixed;z-index:3;font:11px/1.7 "JetBrains Mono","SF Mono",Consolas,monospace;color:rgba(120,235,245,.5);letter-spacing:.08em;pointer-events:none;animation:bootIn 1s ease-out 3.8s backwards}
#hudL{left:44px;bottom:26px}#hudR{right:44px;bottom:26px;text-align:right}
.edge{position:fixed;z-index:3;top:22%;bottom:22%;width:7px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,240,255,.3) 0 1px,transparent 1px 10px);animation:bootIn 1s ease-out 3.8s backwards}
#eL{left:14px}#eR{right:14px}
@media(max-width:900px){.edge,.hud{display:none}}
@keyframes bootIn{from{opacity:0}to{opacity:1}}
#top{animation:bootIn 1s ease-out .2s backwards}
.holo,#togs{animation:bootIn 1s ease-out backwards}
#pL{animation-delay:2.8s}#pR{animation-delay:3.1s}#togs{animation-delay:3.4s}#cmd{animation-delay:3.7s}
#togs,#cmd{transition:opacity .6s}
body.calm #togs,body.calm #cmd{opacity:0;pointer-events:none}
@media(max-width:900px){.holo.side{display:none}#cmd{width:88vw}#togs{flex-wrap:wrap;width:92vw;justify-content:center}}
@media(prefers-reduced-motion:reduce){#rig{transition:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="grid"></div>
<canvas id="fx"></canvas>

<div id="top" class="mono">
  <div style="display:flex;align-items:center">
    <div class="logo" style="font-size:15px">A·I</div>
    <div style="font-size:24px;letter-spacing:.14em"><b style="color:#fff;text-shadow:0 0 12px var(--cy)">J.A.R.V.I.S.</b> <span style="color:rgba(var(--c),.6)">/ AIR COMMAND</span></div>
  </div>
  <div style="font-size:17px;letter-spacing:.12em;color:#bff;display:flex;gap:30px;align-items:center">
    <span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);margin-right:8px"></i><span id="stateTxt">SYSTEM ONLINE</span></span>
    <span id="clock">--:--:--</span><span>V. 4.2.08</span>
  </div>
</div>

<div id="stage"><div id="rig">

  <!-- 左翼 -->
  <section id="pL" class="holo side" style="left:2.5%;top:15%;transform:rotateY(14deg);transform-origin:0 50%">
    <div class="mini" tabindex="0" role="button" aria-label="展开 AI 大模型配置"><span class="badge off" id="miniM"><i></i><span>未连接</span></span><span class="cbtn">+</span></div>
    <div class="full">
    <div class="ttl"><span>AI 大模型配置</span><button class="cbtn" aria-label="收起">–</button></div>
    <select id="provider" class="fld" aria-label="服务商">
      <option>DeepSeek</option>
      <option>通义千问 (Qwen)</option>
      <option>智谱清言 (GLM)</option>
      <option>Moonshot (Kimi)</option>
      <option>Google Gemini</option>
      <option>OpenAI (ChatGPT)</option>
      <option>Anthropic Claude</option>
      <option>自定义 API (OpenAI兼容)</option>
    </select>
    <div style="display:grid;gap:8px;margin:9px 0">
      <select id="aiModel" class="fld" aria-label="模型">
        <option>deepseek-chat</option>
        <option>deepseek-reasoner</option>
      </select>
      <input id="aiModelCustom" type="text" class="fld" placeholder="输入模型名（自定义服务商使用）" autocomplete="off" style="display:none">
      <input id="aiUrl" type="url" class="fld" placeholder="接口地址（留空用默认；自定义 API 必填）" autocomplete="off">
    </div>
    <div style="display:flex;gap:8px;margin:9px 0">
      <input id="apikey" type="password" class="fld" placeholder="输入 API Key" autocomplete="off">
      <button id="save" class="btn">保存</button>
    </div>
    <button id="test" class="btn" style="width:100%;margin-top:2px">保存并测试</button>
    <span id="mstat" class="badge off"><i></i><span>大模型未连接</span></span>
    <div class="ttl" style="margin-top:22px">功能模块 <small>可扩展</small></div>
    <div class="grid3" id="mods">
      <button class="mod" data-k="voice"><b>◉</b>语音唤醒</button>
      <button class="mod" data-k="search"><b>⌕</b>联网搜索</button>
      <button class="slot" data-slot="1"><b>+</b>预留槽位</button>
      <button class="slot" data-slot="2"><b>+</b>预留槽位</button>
      <button class="slot" data-slot="3"><b>+</b>预留槽位</button>
      <button class="slot" data-slot="4"><b>+</b>预留槽位</button>
    </div>
    </div>
  </section>

  <!-- 中央字幕与控制 -->
  <div id="sub">贾维斯已上线，随时待命</div>
  <div id="togs">
    <button class="tog on" data-k="vision">视觉感知 <em>[ON]</em></button>
    <button class="tog" data-k="auto">自动接管 <em>[OFF]</em></button>
    <button class="tog" data-k="voice-style">声线切换 <em>[A]</em></button>
    <button class="tog" data-k="shot">快速截屏分析</button>
  </div>
  <form id="cmd" class="holo" onsubmit="return false">
    <input id="cmdin" class="fld" placeholder="向贾维斯下达指令…" autocomplete="off">
    <button class="btn" id="send">发送</button>
  </form>

let typTimer=null,outTimer=null,outQueue=[],outToken=0;
function splitOutput(text){
  const raw=String(text||'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
  if(!raw)return [];
  const parts=raw.split(/(?<=[。！？!?；;])(?![”’」』])/)
    .flatMap(s=>s.split(/(?<=[。！？!?；;][”’」』])/))
    .map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const p of parts){
    if(p.length<=56){out.push(p);continue}
    let rest=p;
    while(rest.length>56){
      let cut=Math.max(rest.lastIndexOf('，',56),rest.lastIndexOf(',',56),rest.lastIndexOf('、',56),rest.lastIndexOf('：',56));
      if(cut<28)cut=56;
      out.push(rest.slice(0,cut+1).trim());
      rest=rest.slice(cut+1).trim();
    }
    if(rest)out.push(rest);
  }
  if(out.length>1&&out[out.length-1].length<3)out[out.length-2]+=out.pop();
  return out;
}
function typeText(text,token){
  token=(token==null)?outToken:token;
  clearTimeout(typTimer);
  const s=$('sub');
  s.style.opacity='1';
  // 字幕必须跟语音同步：整句立即出现，不再逐字打字拖慢半秒以上。
  s.textContent=String(text||'');
}
function clearOutput(token){
  token=(token==null)?outToken:token;
  if(token!==outToken)return;
  clearTimeout(outTimer);clearTimeout(typTimer);outQueue=[];
  const s=$('sub');s.style.opacity='0';
  outTimer=setTimeout(()=>{if(token===outToken){s.textContent='';s.style.opacity='1'}},300);
}
function showNextOutput(){
  clearTimeout(outTimer);clearTimeout(typTimer);
  if(!outQueue.length)return;
  const token=outToken;
  const sentence=outQueue.shift();
  typeText(sentence,token);
  if(outQueue.length){
    outTimer=setTimeout(showNextOutput,Math.max(2800,Math.min(7000,sentence.length*80+900)));
  }else{
    // 最后一句由 Python 在 TTS 播完后清空；这里留足 7 秒兜底，避免字幕永远挂着。
    outTimer=setTimeout(()=>clearOutput(token),Math.max(7000,Math.min(14000,sentence.length*120+3000)));
  }
}
function setOutput(text){
  wake();
  const parts=splitOutput(text);
  outToken++;clearTimeout(outTimer);clearTimeout(typTimer);
  outQueue=parts;
  if(!parts.length){clearOutput(outToken);return}
  $('sub').style.opacity='1';
  showNextOutput();
}

function syncModelSelect(selected){

  if(!sel||!custom)return;
  const provider=$('provider').value;
  const list=Array.isArray(providerModels[provider])?providerModels[provider].slice():[];
  const isCustomProvider=provider==='自定义 API (OpenAI兼容)';
  sel.innerHTML='';
  if(isCustomProvider){
    sel.style.display='none';
    custom.style.display='';

  }
  sel.style.display='';
  custom.style.display='none';
  const values=list.map(String).filter(Boolean);
  const current=String(selected||'').trim();
  if(current&&current!=='__custom__'&&!values.includes(current))values.push(current);
  values.forEach(m=>{const o=document.createElement('option');o.value=o.textContent=m;sel.appendChild(o)});
  const other=document.createElement('option');
  other.value='__custom__';other.textContent='其他模型（手动输入）';

  if(!want||![...sel.options].some(o=>o.value===want))want=values[0]||'__custom__';
  sel.value=want;
  if(want==='__custom__'){
    custom.style.display='';

  }

<script>
/* ===== J.A.R.V.I.S. 安全桥接适配层（不改任何视觉 CSS） ===== */
(() => {
  'use strict';
  const UI = window.JarvisUI;
  if (!UI) return;
  const errors = window.__JARVIS_ERRORS__ = window.__JARVIS_ERRORS__ || [];
  const stateMap = {IDLE:'idle', LISTENING:'listening', PERCEIVING:'thinking',
                    THINKING:'thinking', ACTING:'speaking', GUARD:'thinking'};
  const voiceMap = {
    A:{tts_voice:'云希', robot_voice:false},
    B:{tts_voice:'云扬', robot_voice:false},
    C:{robot_voice:true},
  };
  const apiQueue = [];
  let reported = false, lastOutput = '', lastGuard = '', lastConfigKey = '';
  let guardButtons = null, guardKey = null, readyTimer = 0;

  function callApi(name, ...args) {
    const api = window.pywebview && window.pywebview.api;
    if (api && typeof api[name] === 'function') {
      // pywebview JS→Python 调用是同步阻塞 WebView2 UI 线程的；
      // 用 setTimeout(0) 解耦，让调用不卡住页面交互和 evaluate_js 推送。
      return new Promise(resolve => {
        setTimeout(() => {
          try { resolve(api[name](...args)); }
          catch (e) { errors.push(String(e && e.message || e)); resolve(false); }
        }, 0);
      });
    }
    return new Promise(resolve => apiQueue.push({name, args, resolve}));
  }

  function flushQueue() {
    const api = window.pywebview && window.pywebview.api;
    if (!api) return;
    while (apiQueue.length) {
      const item = apiQueue.shift();
      try { item.resolve(api[item.name](...item.args)); }
      catch (e) { errors.push(String(e && e.message || e)); }
    }
  }

  function reportReady() {
    if (reported) return true;
    const api = window.pywebview && window.pywebview.api;
    if (!api || typeof api.report !== 'function') return false;
    try {
      api.report({bridge:'JarvisHUD', width:innerWidth, height:innerHeight,
                  dpr:devicePixelRatio || 1, state:'loaded'});
    } catch (e) {
      errors.push(String(e && e.message || e));
      return false;
    }
    reported = true;
    if (readyTimer) { clearInterval(readyTimer); readyTimer = 0; }
    UI.addLog('UI 桥接已就绪');
    dispatchEvent(new CustomEvent('jarvis:loaded', {detail:{
      width:innerWidth, height:innerHeight, dpr:devicePixelRatio || 1
    }}));
    flushQueue();
    return true;
  }

  function scheduleReady() {
    if (reportReady()) return;
    if (readyTimer) return;
    let n = 0;
    readyTimer = setInterval(() => {
      n++;
      if (reportReady() || n >= 20) { clearInterval(readyTimer); readyTimer = 0; }
    }, 250);
  }

  addEventListener('pywebviewready', scheduleReady);
  addEventListener('load', () => setTimeout(scheduleReady, 0));
  setTimeout(scheduleReady, 0);

  function setToggle(key, on) {
    const b = document.querySelector('.tog[data-k="' + key + '"]');
    if (!b) return;
    const em = b.querySelector('em');
    if (em) em.textContent = on ? '[ON]' : '[OFF]';
    b.classList.toggle('on', !!on);
  }

  function populateProviders(list, models) {
    if (models && window.__jarvisSetProviderModels) window.__jarvisSetProviderModels(models);
    if (!Array.isArray(list) || !list.length) return;
    const sel = document.getElementById('provider');
    if (!sel) return;
    const current = sel.value;
    sel.innerHTML = '';
    list.forEach(p => {
      const o = document.createElement('option');
      o.textContent = String(p);
      sel.appendChild(o);
    });
    if (list.map(String).includes(current)) sel.value = current;
    if (window.__jarvisSyncModelSelect) window.__jarvisSyncModelSelect(current);
  }

  function applyConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const keySet = !!(cfg.api_key || cfg.api_key_set);
    const key = JSON.stringify([cfg.ai_provider, cfg.ai_model, cfg.ai_url, cfg.tts_voice, cfg.robot_voice,
      cfg.vision_enabled, cfg.always_listen, keySet, cfg.api_key_hint, cfg.providers]);
    if (key === lastConfigKey) return;
    lastConfigKey = key;
    if (cfg.providers) populateProviders(cfg.providers, cfg.provider_models);
    if (cfg.ai_provider) {
      const sel = document.getElementById('provider');
      if (sel && [...sel.options].some(o => o.value === cfg.ai_provider)) sel.value = cfg.ai_provider;
    }
    if (window.__jarvisSyncModelSelect) window.__jarvisSyncModelSelect(cfg.ai_model);
    const url = document.getElementById('aiUrl');
    if (url) url.value = String(cfg.ai_url || '');
    if ('vision_enabled' in cfg) setToggle('vision', !!cfg.vision_enabled);
    if ('always_listen' in cfg) setToggle('auto', !!cfg.always_listen);
    if ('tts_voice' in cfg || 'robot_voice' in cfg) {
      const style = cfg.robot_voice ? 'C' : (String(cfg.tts_voice) === '云扬' ? 'B' : 'A');
      if (UI.setVoiceStyle) UI.setVoiceStyle(style);
    }
    UI.setModelStatus(keySet, cfg.ai_provider || '');
    const ak = document.getElementById('apikey');
    if (ak) {
      // 密钥明文不进页面, 但要把"已保存的是哪一把"写出来, 否则用户看到空框会以为没存住
      const hint = String(cfg.api_key_hint || '');
      ak.placeholder = keySet
        ? (hint && hint !== '未配置' ? `已保存 ${hint} · 留空保持不变` : '已配置 · 留空保持不变')
        : '输入 API Key';
    }
  }

  function clearGuard(reset) {
    if (guardButtons) {
      guardButtons.forEach(b => b.remove());
      guardButtons = null;
    }
    document.querySelectorAll('.tog[data-k]').forEach(b => { b.style.display = ''; });
    if (guardKey) { removeEventListener('keydown', guardKey, true); guardKey = null; }
    if (reset) lastGuard = '';
  }

  function resolveGuard(ok) {
    callApi('resolve_guard', !!ok);
    UI.addLog(ok ? 'GUARD 用户确认执行' : 'GUARD 用户取消执行');
    clearGuard(false);
  }

  function handleGuard(guard) {
    if (!guard || !guard.desc) { if (lastGuard) clearGuard(true); return; }
    const desc = String(guard.desc);
    if (desc === lastGuard) return;
    lastGuard = desc;
    UI.setOutput('⚠ 高危操作待确认：' + desc + '。请选择确认或取消。');
    UI.addLog('GUARD  ' + desc);
    if (guardButtons) return;
    const togs = document.getElementById('togs');
    if (!togs) return;
    document.querySelectorAll('.tog[data-k]').forEach(b => { b.style.display = 'none'; });
    const yes = document.createElement('button');
    yes.type = 'button';
    yes.className = 'tog on';
    yes.textContent = '确认执行 [Y]';
    yes.onclick = () => resolveGuard(true);
    const no = document.createElement('button');
    no.type = 'button';
    no.className = 'tog';
    no.textContent = '取消 [N]';
    no.onclick = () => resolveGuard(false);
    togs.appendChild(yes);
    togs.appendChild(no);
    guardButtons = [yes, no];
    guardKey = e => {
      const k = String(e.key || '').toLowerCase();
      if (!lastGuard || (k !== 'y' && k !== 'n')) return;
      e.preventDefault();
      resolveGuard(k === 'y');
    };
    addEventListener('keydown', guardKey, true);
  }

  function update(payload) {
    payload = payload || {};
    const snap = payload.snap || {};
    if (snap.state) {
      UI.setState(stateMap[String(snap.state).toUpperCase()] || (snap.speaking ? 'speaking' : 'idle'));
    }
    if (snap.level != null) UI.setAudioLevel(snap.level);
    const snapSub = String(snap.subtitle || '').trim();
    const out = snapSub || ((typeof payload.output === 'string' && payload.output.trim())
      ? payload.output : '');
    if (out && out !== lastOutput) { lastOutput = out; UI.setOutput(out); }
    else if (!out && lastOutput) { lastOutput = ''; UI.clearOutput(); }
    const m = payload.metrics || {};
    if (m.cpu != null || m.memory != null || m.ram != null || m.disk != null) {
      UI.setTelemetry({cpu:m.cpu, ram:(m.memory !== undefined ? m.memory : m.ram), disk:m.disk});
    }
    applyConfig(payload.config);
    (payload.logs || []).forEach(line => { if (line) UI.addLog(String(line)); });
    if (payload.notice && payload.notice.message) {
      UI.addLog((payload.notice.ok === false ? '错误: ' : '') + payload.notice.message);
      // 收到测试结果后恢复测试按钮
      const testBtn = document.getElementById('test');
      if (testBtn && testBtn.disabled) { testBtn.disabled = false; testBtn.textContent = '保存并测试'; }
      const saveBtn = document.getElementById('save');
      if (saveBtn && saveBtn.disabled) { saveBtn.disabled = false; saveBtn.textContent = '保存'; }
    }
    handleGuard(snap.guard);
  }

  window.JarvisHUD = {
    update,
    setAnimating:on => UI.setAnimating ? UI.setAnimating(on) : null,
    ready:scheduleReady,
    getDiagnostics:() => ({
      errors:errors.slice(-20), reported, lastOutput, lastGuard,
      apiReady:!!(window.pywebview && window.pywebview.api),
      animating:UI.getAnimating ? UI.getAnimating() : null
    })
  };

  addEventListener('jarvis:command', e => {
    const text = String((e.detail && e.detail.text) || '').trim();
    if (text) callApi('command', text);
  });
  addEventListener('jarvis:saveModel', e => {
    const d = e.detail || {};
    const patch = {
      ai_provider:String(d.provider || ''),
      ai_model:String(d.model || ''),
      ai_url:String(d.url || '')
    };
    const key = String(d.apiKey || '').trim();
    if (key) patch.api_key = key;
    callApi('save_config', patch);
  });
  addEventListener('jarvis:testModel', e => {
    const d = e.detail || {};
    const patch = {
      ai_provider:String(d.provider || ''),
      ai_model:String(d.model || ''),
      ai_url:String(d.url || '')
    };
    const key = String(d.apiKey || '').trim();
    if (key) patch.api_key = key;
    callApi('test_llm', patch);
  });
  addEventListener('jarvis:toggle', e => {
    const d = e.detail || {};
    if (d.key === 'vision') callApi('save_config', {vision_enabled:!!d.on});
    else if (d.key === 'auto') callApi('save_config', {always_listen:!!d.on});
    else if (d.key === 'voice-style') callApi('save_config', voiceMap[d.voice] || {});
    else if (d.key === 'shot') callApi('command', '截图');
  });
  addEventListener('keydown', e => {
    if (String(e.key || '') !== 'Escape') return;
    e.preventDefault();
    if (lastGuard) { resolveGuard(false); return; }
    UI.addLog('ESC 收起为灵动岛');
    callApi('collapse');
  }, true);
})();
</script>
